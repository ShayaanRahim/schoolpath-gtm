# schools the drafter is allowed to name, and the ONLY facts it may state about them.
# rule: a fact goes here only with a source. ops adds rows as parents and tours confirm details.
#
# schoolpath_url: the school's SchoolPath profile (non-guessable uuid urls, so they're listed here).
#   when a post names a school that has one, the reply links to THAT page, not the generic search.
#   null = SchoolPath has no page for it yet. mentions of these are counted as catalog gaps.
# safe_review_themes: review themes the reply may paraphrase ("parents on SchoolPath mention ...").
#   only operational themes (homework, communication, car line, class size, admissions).
#   allegations (discrimination, violence, abuse, safety incidents) are NEVER repeated in a reply,
#   even when they appear in the AI summary: 4 reviews is not a fact, and a SchoolPath-linked account
#   repeating them about a named school is the screenshot we can't afford.

- name: SST Sonterra
  aliases: ["sst sonterra", "sonterra"]
  schoolpath_url: /en/marketplace/schools/8bd08ee6-bfaa-49b0-a2ee-72f88945cff9
  facts:
    - tuition-free public charter, PK3 through 6th grade, STEM and project-based learning
    - SchoolPath shows open PK3 and PK4 seats (updated Aug 2026, confirm before posting)
    - applications for next year open Nov 1, 2026, deadline Jan 1, 2027
    - you can book a tour or request info from its SchoolPath page
  safe_review_themes:
    - parents praise the academics and say staff treat kids with respect
    - parents say administration is responsive
  review_count: 4
  never_repeat: ["discrimination", "violence", "safety incidents", "bullying incidents"]
  source: SchoolPath profile, viewed Oct 27, 2026

